name: Game-BIN Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/sdlpal/sdlpal.git
  REPO_BRANCH: v2.0.2021.0214
  PKG_NAME: jinyong
  EXTRA_NAME_1: sdlpal98
  EXTRA_NAME_2: vcmi
  EXTRA_NAME_3: bermuda
  EXTRA_NAME_4: soniccd
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  
jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Initialization environment
      run: |
        sudo apt-get update
        sudo apt-get install -y -q --no-install-recommends build-essential make cmake wget autogen autoconf automake p7zip-full -y
        sudo apt-get -y autoremove
        sudo apt-get -y clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo sed -i 's/# \(en_US.UTF-8\)/\1/' /etc/locale.gen
        sudo locale-gen --purge --lang en_US.UTF-8
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        mkdir -p $PKG_NAME
        wget https://github.com/steward-fu/website/releases/download/miyoo/src_jinyong.7z
        7za x src_jinyong.7z
        git clone $REPO_URL -b $REPO_BRANCH --depth 1 ${PKG_NAME}/$EXTRA_NAME_1
        git clone https://github.com/vcmi/vcmi.git -b 1.6.8 --depth 1 ${PKG_NAME}/$EXTRA_NAME_2
        git clone https://github.com/oneapi-src/oneTBB.git --depth 1 ${PKG_NAME}/$EXTRA_NAME_2/oneTBB
        git clone https://github.com/cyxx/bermuda.git -b 0.1.7 --depth 1 ${PKG_NAME}/$EXTRA_NAME_3
        git clone https://github.com/RSDKModding/RSDKv3-Decompilation.git -b 1.3.3 --depth 1 ${PKG_NAME}/$EXTRA_NAME_4
        ln -sf /workdir/$PKG_NAME $GITHUB_WORKSPACE/$PKG_NAME
        cd && wget https://github.com/steward-fu/nds_miyoo/releases/download/assets/toolchain.tar.gz
        cd && tar xvf toolchain.tar.gz
        sudo mv mmiyoo /opt
        sudo mv prebuilt /opt
        sudo rm /opt/mmiyoo/arm-buildroot-linux-gnueabihf/sysroot/usr/lib/liblua.so

    - name: Load custom configuration
      run: |
        cd $PKG_NAME && mkdir -p _opk
        mv $GITHUB_WORKSPACE/applications/$PKG_NAME/$PKG_NAME.patch ./
        mv $GITHUB_WORKSPACE/applications/$PKG_NAME/ ./_opk
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_1/$EXTRA_NAME_1.patch $EXTRA_NAME_1
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_1/ ./_opk
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_2/* $EXTRA_NAME_2
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_2/ ./_opk
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_3/$EXTRA_NAME_3.patch $EXTRA_NAME_3
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_3/ ./_opk
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_4/$EXTRA_NAME_4.patch $EXTRA_NAME_4
        mv $GITHUB_WORKSPACE/applications/$EXTRA_NAME_4/ ./_opk
        wget https://www.lua.org/ftp/lua-5.1.5.tar.gz
        tar xvf lua-5.1.5.tar.gz
        patch -p1 < $PKG_NAME.patch
        cd $EXTRA_NAME_1 && mkdir -p opengl/
        mv $GITHUB_WORKSPACE/tools/opengl.tar.gz ./
        tar -zxvf opengl.tar.gz -C opengl/
        patch -p1 < $EXTRA_NAME_1.patch
        sudo mv opengl/ /opt
        cd ../$EXTRA_NAME_2
        wget -O- "https://archives.boost.io/release/1.78.0/source/boost_1_78_0.tar.bz2" | tar xj
        mv boost_1_78_0 boost
        patch -p1 < $EXTRA_NAME_2.patch
        cd ../$EXTRA_NAME_3
        patch -p1 < $EXTRA_NAME_3.patch
        cd ../$EXTRA_NAME_4
        patch -p1 < $EXTRA_NAME_4.patch

    - name: Compile the firmware
      id: compile
      run: |
        cd $PKG_NAME && chmod +x ./*.sh
        ./build.sh
        cd $EXTRA_NAME_1 && make -C unix -j8 V=s
        cd ../$EXTRA_NAME_2 && chmod +x ./*.sh ./boost/build.sh ./oneTBB/build.sh
        git submodule init && git submodule update
        cd boost && ./build.sh
        cd ../oneTBB && ./build.sh
        cd .. && ./build.sh
        ./strip.sh
        cd ../$EXTRA_NAME_3 && chmod +x ./*.sh
        ./build.sh
        cd ../$EXTRA_NAME_4 && chmod +x ./*.sh
        ./build.sh
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=$PKG_NAME" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        /opt/mmiyoo/bin/arm-linux-gnueabihf-strip ${PKG_NAME}/src/jysdllua -o $PKG_NAME/_opk/${PKG_NAME}/jysdllua
        /opt/mmiyoo/bin/arm-linux-gnueabihf-strip ${PKG_NAME}/${EXTRA_NAME_1}/unix/sdlpal -o $PKG_NAME/_opk/${EXTRA_NAME_1}/${EXTRA_NAME_1}
        /opt/mmiyoo/bin/arm-linux-gnueabihf-strip ${PKG_NAME}/${EXTRA_NAME_3}/bs -o $PKG_NAME/_opk/${EXTRA_NAME_3}/bs
        /opt/mmiyoo/bin/arm-linux-gnueabihf-strip ${PKG_NAME}/${EXTRA_NAME_4}/build/RSDKv3 -o $PKG_NAME/_opk/${EXTRA_NAME_4}/${EXTRA_NAME_4}
        cd $PKG_NAME/_opk
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*.opk
